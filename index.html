
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Loading Screen -->
    <div id="loading">
        <h1>🎮 Welcome to My Game</h1>
        <h2>✊ ✋ ✌️</h2>
        <div class="loader"></div>
        <h3>Loading... Please Wait</h3>
    </div>

    <!-- Main Game -->
    <main id="game">

        <h1>✊ Rock Paper Scissors ✌️</h1>
        <h3>Choose Your Game Mode</h3>

        <div class="mode">
            <button onclick="setMode('two')">👥 Two Players</button>
            <button onclick="setMode('computer')">🤖 Play With Computer</button>
        </div>

        <h2 id="modeTitle">Select Game Mode</h2>

        <!-- Scoreboard -->
        <section class="scoreboard">

            <div class="score-card">
                <h3>👤 Player 1</h3>
                <h1 id="score1">0</h1>
            </div>

            <div class="score-card">
                <h3 id="opponentTitle">👤 Player 2</h3>
                <h1 id="score2">0</h1>
            </div>

            <div class="score-card">
                <h3>🤝 Draws</h3>
                <h1 id="draws">0</h1>
            </div>

        </section>

        <h2 id="round">Round: 0</h2>

        <!-- Player 1 -->
        <section class="player">

            <h2>👤 Player 1</h2>
            <h3>Choose Your Hand</h3>

            <div class="choices">
                <button onclick="selectPlayer1('rock')">✊ Rock</button>
                <button onclick="selectPlayer1('paper')">✋ Paper</button>
                <button onclick="selectPlayer1('scissors')">✌️ Scissors</button>
            </div>

            <h3 id="player1Choice">Waiting...</h3>

        </section>

        <!-- Player 2 / Computer -->
        <section class="player" id="player2Section">

            <h2 id="player2Heading">👤 Player 2</h2>
            <h3 id="player2Instruction">Choose Your Hand</h3>

            <div class="choices" id="player2Buttons">
                <button onclick="selectPlayer2('rock')">✊ Rock</button>
                <button onclick="selectPlayer2('paper')">✋ Paper</button>
                <button onclick="selectPlayer2('scissors')">✌️ Scissors</button>
            </div>

            <h3 id="player2Choice">Waiting...</h3>

        </section>

        <!-- Game Result -->
        <section class="result-box">
            <h2 id="result">Please select a game mode!</h2>
        </section>

        <button class="restart" onclick="restartGame()">
            🔄 Restart Game
        </button>

    </main>

    <script src="script.js"></script>

</body>
</html>
